name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Console Dockerfile present
        run: |
          set -euo pipefail
          test -f console/Dockerfile
          echo "9ai-ext-google is console-only (file-presence gate)."
          find console -type f | sort
