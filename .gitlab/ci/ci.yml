check:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - test -f console/Dockerfile
    - echo "9ai-ext-google is console-only (file-presence gate)."
    - find console -type f | sort
