check:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
  before_script:
    - |
      set -eu
      apk add --no-cache git
      if [ -n "${PACKAGE_GIT_TOKEN:-}" ]; then
        git config --global url."https://oauth2:${PACKAGE_GIT_TOKEN}@git.44dev.com/".insteadOf "https://git.44dev.com/"
      else
        git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@git.44dev.com/".insteadOf "https://git.44dev.com/"
      fi
  script:
    - docker build -t "${CI_PROJECT_PATH_SLUG}:check" console/
