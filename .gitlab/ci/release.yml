release:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    GIT_DEPTH: 0
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.+\..+\..+$/
    - if: $CI_COMMIT_BRANCH =~ /^release\/v.+\..+\..+$/
  before_script:
    - |
      set -eu
      apk add --no-cache git python3 curl
      if [ -n "${PACKAGE_GIT_TOKEN:-}" ]; then
        git config --global url."https://oauth2:${PACKAGE_GIT_TOKEN}@git.44dev.com/".insteadOf "https://git.44dev.com/"
      else
        git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@git.44dev.com/".insteadOf "https://git.44dev.com/"
      fi
  script:
    - |
      ref="${CI_COMMIT_REF_NAME}"
      ver="${ref#release/v}"
      ver="${ver#v}"
      printf '%s\n' "$ver" > .release-version
    - |
      python3 - "$(cat .release-version)" <<'PY'
      import json, pathlib, re, sys
      ver = sys.argv[1]
      errors = []
      p = pathlib.Path("pyproject.toml")
      if p.exists():
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"', p.read_text(encoding="utf-8"))
          if not m:
              errors.append('pyproject.toml has no version = "..."')
          elif m.group(1) != ver:
              errors.append(f"pyproject.toml version {m.group(1)!r} != {ver!r}")
      j = pathlib.Path("package.json")
      if j.exists():
          pkg_ver = json.loads(j.read_text(encoding="utf-8")).get("version")
          if pkg_ver is None:
              errors.append("package.json has no version")
          elif pkg_ver != ver:
              errors.append(f"package.json version {pkg_ver!r} != {ver!r}")
      if errors:
          sys.stderr.write("\n".join(errors) + "\n")
          sys.exit(1)
      PY
    - docker build -t "${CI_PROJECT_PATH_SLUG}:release" console/
    - |
      ver="$(cat .release-version)"
      python3 - "$ver" <<'PY' > /tmp/release-notes.md
      import pathlib, re, sys
      ver = sys.argv[1]
      path = pathlib.Path("CHANGELOG.md")
      if not path.exists():
          sys.stderr.write("CHANGELOG.md missing; cannot slice release notes\n")
          sys.exit(1)
      text = path.read_text(encoding="utf-8")
      pat = re.compile(
          rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## |\Z)",
          re.MULTILINE | re.DOTALL,
      )
      m = pat.search(text)
      if not m:
          sys.stderr.write(f"CHANGELOG.md has no ## [{ver}] section\n")
          sys.exit(1)
      heading = text[m.start() :].split("\n", 1)[0]
      sys.stdout.write(f"# Release v{ver}\n\n{heading}\n{m.group(1).rstrip()}\n")
      PY
    - |
      ver="$(cat .release-version)"
      if [ -z "${CI_COMMIT_TAG:-}" ]; then
        git config user.name "gitlab-ci[bot]"
        git config user.email "gitlab-ci@${CI_SERVER_HOST}"
        tag="v${ver}"
        if git rev-parse "$tag" >/dev/null 2>&1; then
          echo "tag $tag already exists"
        else
          git tag -a "$tag" -m "Release ${ver}"
          git push "$CI_REPOSITORY_URL" "$tag"
        fi
      fi
    - |
      ver="$(cat .release-version)"
      tag="v${ver}"
      code=$(curl -sS -o /tmp/gl-release.json -w "%{http_code}" \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${tag}")
      if [ "$code" = "200" ]; then
        echo "release $tag already exists"
        exit 0
      fi
      VERSION="$ver" python3 - <<'PY'
      import json
      import os
      import urllib.request

      ver = os.environ["VERSION"]
      notes = open("/tmp/release-notes.md", encoding="utf-8").read()
      body = json.dumps(
          {
              "name": f"Release v{ver}",
              "tag_name": f"v{ver}",
              "description": notes,
          }
      ).encode()
      req = urllib.request.Request(
          f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/releases",
          data=body,
          headers={
              "JOB-TOKEN": os.environ["CI_JOB_TOKEN"],
              "Content-Type": "application/json",
          },
          method="POST",
      )
      with urllib.request.urlopen(req) as resp:
          resp.read()
      PY
